<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, follow" />
    <title>الصفحة غير موجودة (404) | منصة آدا</title>
        <link rel="icon" type="image/png" href="/logo.png" />
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #0b0b0f;
        color: #f5f5f7;
        font-family: system-ui, -apple-system, "Segoe UI", Tahoma, Arial, sans-serif;
        text-align: center;
      }
      .code {
        margin: 0;
        font-size: clamp(56px, 18vw, 120px);
        font-weight: 800;
        line-height: 1;
        letter-spacing: 2px;
      }
      h1 { margin: 16px 0 8px; font-size: clamp(20px, 5vw, 28px); }
      p.lead {
        margin: 0 auto 28px;
        max-width: 46ch;
        font-size: 16px;
        line-height: 1.9;
        color: #c3c3cc;
      }
      .actions { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
      a.btn {
        display: inline-block;
        padding: 12px 22px;
        border-radius: 999px;
        text-decoration: none;
        font-weight: 700;
        font-size: 15px;
      }
      a.primary { background: #f5f5f7; color: #0b0b0f; }
      a.ghost { border: 1px solid #45454f; color: #f5f5f7; }
      a.btn:focus-visible { outline: 2px solid #7aa2ff; outline-offset: 3px; }
      @media (prefers-reduced-motion: no-preference) {
        a.btn { transition: opacity 0.2s ease; }
        a.btn:hover { opacity: 0.85; }
      }
    </style>
  </head>
  <body>
    <main>
      <p class="code">404</p>
      <h1>هذه الصفحة غير موجودة</h1>
      <p class="lead">
        الرابط الذي طلبته غير صحيح أو تم تغييره. يمكنك العودة إلى الصفحة الرئيسية
        أو الانتقال مباشرة إلى الدورات.
      </p>
      <div class="actions">
        <a class="btn primary" href="/">الصفحة الرئيسية</a>
        <a class="btn ghost" href="/#courses">الدورات</a>
        <a class="btn ghost" href="/#contact">تواصل معنا</a>
      </div>
    </main>
  </body>
</html>
